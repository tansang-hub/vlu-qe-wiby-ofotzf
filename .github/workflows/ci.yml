name: CI Commit Stage

# Kích hoạt workflow khi có event push hoặc pull request vào nhánh main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # Bước 1: Checkout mã nguồn từ repository về runner
    - name: Checkout repository
      uses: actions/checkout@v4

    # Bước 2: Khởi tạo môi trường Node.js (phiên bản 18 hoặc 20)
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-index: '20'
        cache: 'npm'

    # Bước 3: Cài đặt các thư viện phụ thuộc (dependencies trong package.json)
    - name: Install dependencies
      run: npm ci

    # Bước 4: Tự động chạy lệnh test (Jest)
    - name: Run Jest Unit Tests
      run: npm test

