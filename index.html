<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
</head>
<body>
    <h2>Đăng Nhập</h2>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Tên đăng nhập" required><br><br>
        <input type="password" id="password" placeholder="Mật khẩu" required><br><br>
        <button type="submit">Đăng nhập</button>
    </form>
    <div id="message"></div>

    <script src="auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const msg = document.getElementById('message');
            msg.textContent = validateLogin(user, pass) ? "Đăng nhập thành công!" : "Tên đăng nhập hoặc mật khẩu sai!";
        });
    </script>
</body>
</html>
